name: RedBus Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbus-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RedBus monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python redbus_monitor_telegram.py

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json config.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update RedBus monitor state"
            for attempt in 1 2 3; do
              if ! git fetch origin main; then
                echo "Fetch attempt $attempt failed; retrying."
                continue
              fi
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "Rebase attempt $attempt failed; retrying."
                continue
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
            done
            echo "Could not push monitor state after 3 attempts."
            exit 1
          fi