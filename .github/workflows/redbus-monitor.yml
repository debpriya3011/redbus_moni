name: RedBus Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbus-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RedBus monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python redbus_monitor_telegram.py

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json config.json

          if git diff --cached --quiet; then
            echo "No state or config changes."
          else
            git commit -m "Update RedBus monitor state [skip ci]"
            pushed=0
            for attempt in 1 2 3 4 5; do
              echo "Push attempt $attempt..."
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                pushed=1
                echo "Successfully pushed state update."
                break
              fi
              echo "Push attempt $attempt failed; retrying in 3s..."
              sleep 3
            done

            if [ $pushed -ne 1 ]; then
              echo "Could not push monitor state after 5 attempts."
              exit 1
            fi
          fi